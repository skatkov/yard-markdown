name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: test
        run: bundle exec rake test
      - name: validate real-world markdown
        run: bundle exec rake markdown:validate_real_world
      - name: yard-lint
        if: matrix.ruby == '4.0'
        run: bundle exec yard-lint
      - name: check generated RBS types
        if: matrix.ruby == '4.0'
        run: bundle exec rake types:check
      - name: Standard Ruby
        if: matrix.ruby == '4.0'
        uses: standardrb/standard-ruby-action@v1
      - name: Run Mutant
        if: matrix.ruby == '4.0'
        run: |
          git fetch origin main
          bundle exec mutant run --fail-fast --since origin/main
