name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim
    name: Lint
    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: yard-lint
        run: bundle exec yard-lint
      - name: Standard Ruby
        run: bundle exec standardrb

  build:
    runs-on: ubuntu-slim
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: test
        run: bundle exec rake test
      - name: validate real-world markdown
        if: matrix.ruby == '4.0'
        run: bundle exec rake markdown:validate_real_world

  mutant:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-slim
    name: Mutant
    steps:
      - uses: actions/checkout@v5
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run Mutant
        run: |
          git fetch origin main
          bundle exec mutant run --fail-fast
